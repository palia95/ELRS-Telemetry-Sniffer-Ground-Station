# =====================================================================
# LILYGO T3-S3 ELRS Telemetry Sniffer (Ghost RX) - PlatformIO targets
# =====================================================================
# Copy this file into ExpressLRS `src/targets/` (PlatformIO auto-includes
# every *.ini there), then build one of the envs below from `src/`:
#
#   pio run -e T3S3_Sniffer_2400_RX_Serial       # <-- start here (serial debug)
#
# Pins come from the runtime hardware layout
# (firmware/hardware/lilygo_t3s3_sniffer_rx.json), which you flash via the
# ELRS WiFi web UI after the first USB flash. See docs/02_build_flash_guide.md.
#
# IMPORTANT: the binding phrase and the regulatory domain are NOT set here.
# ExpressLRS processes MY_BINDING_PHRASE from `src/user_defines.txt` (its
# build_flags.py turns it into -DMY_UID). build.sh writes user_defines.txt for
# you from the phrase you pass as the 3rd argument. Do not put a quoted phrase
# in an ini build_flag - PlatformIO's tokenizer mangles the quotes.
# =====================================================================

# ---------- Serial-only: bench bring-up (Phases 1-3) ----------
[env:T3S3_Sniffer_2400_RX_Serial]
extends = env_common_esp32s3rx, radio_2400
# T3-S3 uses ESP32-S3FH4R2 = 4MB in-package flash (+2MB PSRAM). Pin the flash
# size so the partition table / upload offsets match the real chip.
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
	${env_common_esp32s3rx.build_flags}
	${radio_2400.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
	-D GHOST_SNIFFER=1
	-D GHOST_NO_TX=1
	-D GHOST_TRANSPORT_SERIAL=1
	-D GHOST_SERIAL_HEX=1
	-D DEBUG_LOG=1
	# Silence ESP-IDF/Arduino-HAL [E]/[W]/[I] log spam (e.g. the harmless
	# "uartDetectBaudrate not supported" flood on S3). Our ELRS DBGLN output
	# uses SerialLogger, not the ESP_LOG macros, so it is NOT affected.
	-D CORE_DEBUG_LEVEL=0
	# DEBUG_RX_SCOREBOARD removed: it prints a char PER PACKET from the RxDone
	# ISR; at 150 Hz that floods USB-CDC from interrupt context and trips the
	# interrupt watchdog (Guru Meditation). Re-enable only for brief bring-up.
	# GHOST_DISPLAY re-enabled 2026-07-30 after the OLED init was rewritten to
	# be non-blocking: GhostDisplay_Init() only registers the sink (no I2C in
	# setup()); all I2C now runs from loop() via GhostDisplay_Tick, which probes
	# 0x3C with a bounded Wire timeout before u8g2.begin() and backs off / gives
	# up if the panel never ACKs. A missing OLED can no longer wedge the core.
	-D GHOST_DISPLAY=1
	# NOTE: do NOT set ARDUINO_USB_MODE/CDC_ON_BOOT here. ELRS's S3 code uses
	# `USBSerial` for debug + `Serial` (UART0) for CRSF, which needs the stock
	# S3 USB mode. Forcing HWCDC removes USBSerial and breaks setupSerial().
	# Debug/telemetry output goes to USBSerial (native USB) at 460800 via DEBUG_LOG.
lib_deps =
	${env_common_esp32.oled_lib_deps}
build_src_filter = ${env_common_esp32s3rx.build_src_filter} -<tx_*.cpp>

# ---------- BLE bridge (Phase 4): serial + OLED + BLE, NO WiFi ----------
# Streams every reassembled CRSF frame over BLE (Nordic UART Service) as GATT
# notifications; keeps serial debug + OLED live so you can watch on the bench.
# NimBLE-Arduino @1.4.1 is already pulled in via oled_lib_deps; enabling
# GHOST_TRANSPORT_BLE makes the LDF compile+link devTransport_BLE.cpp.
[env:T3S3_Sniffer_2400_RX_BLE]
extends = env:T3S3_Sniffer_2400_RX_Serial
build_flags =
	${env:T3S3_Sniffer_2400_RX_Serial.build_flags}
	-D GHOST_TRANSPORT_BLE=1

# ---------- Later: add BLE + WiFi-UDP (Phase 4+) ----------
[env:T3S3_Sniffer_2400_RX_Wireless]
extends = env:T3S3_Sniffer_2400_RX_Serial
build_flags =
	${env:T3S3_Sniffer_2400_RX_Serial.build_flags}
	-D GHOST_TRANSPORT_BLE=1
	-D GHOST_TRANSPORT_WIFI_UDP=1
